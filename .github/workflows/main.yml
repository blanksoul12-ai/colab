name: Auto Update Scraper

# 設定觸發時間
on:
  schedule:
    # 每天台灣時間凌晨 2:00 執行 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 讓你可以手動點擊按鈕執行測試

jobs:
  run_scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests pandas gspread google-auth beautifulsoup4

      - name: Create JSON Key
        # 這步會把你存在 Secrets 的內容變回一個檔案，讓 main.py 讀取
        run: echo '${{ secrets.GCP_SA_KEY }}' > service_account.json

      - name: Run Scraper
        run: python main.py
