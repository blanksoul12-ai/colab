name: Auto Update Scraper

on:
  schedule:
    # 每天台灣時間凌晨 2:00 執行 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  run_scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # 將 v3 改為 v4
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 指定 Python 版本，並將 v4 改為 v5
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas gspread google-auth beautifulsoup4

      - name: Create JSON Key
        run: echo '${{ secrets.GCP_SA_KEY }}' > service_account.json

      - name: Run Scraper
        run: python main.py
